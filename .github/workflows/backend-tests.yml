name: Backend Tests & Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort pytest pytest-cov
      
      - name: Run Black (code formatting)
        run: |
          cd backend
          black --check app/
        continue-on-error: true
      
      - name: Run isort (import sorting)
        run: |
          cd backend
          isort --check-only app/
        continue-on-error: true
      
      - name: Run Flake8 (linting)
        run: |
          cd backend
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    name: Security Checks
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety
      
      - name: Run Bandit (security)
        run: |
          cd backend
          bandit -r app/ --severity-level medium
        continue-on-error: true
      
      - name: Check dependencies (Safety)
        run: |
          cd backend
          safety check
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: lint
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bizreg_test
          POSTGRES_USER: bizreg_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Create .env for testing
        run: |
          cd backend
          cat > .env << EOF
          DATABASE_URL=postgresql://bizreg_test:test_password@localhost:5432/bizreg_test
          JWT_SECRET_KEY=test_secret_key_for_ci_testing_only_do_not_use_in_production
          ENVIRONMENT=test
          DEBUG=true
          EOF
      
      - name: Run Alembic migrations
        run: |
          cd backend
          alembic upgrade head
      
      - name: Run pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    name: Type Checking (Mypy)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-pydantic
      
      - name: Run mypy
        run: |
          cd backend
          mypy app/ --ignore-missing-imports
        continue-on-error: true
